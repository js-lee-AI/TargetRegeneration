name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }}, CPU, base install)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the base package and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Base import stays light
        run: python -c "import sys, targetregen; assert 'numpy' not in sys.modules, 'numpy leaked into the base import'; print(targetregen.__version__)"
      - name: Quickstart
        run: python examples/quickstart.py
      - name: Command line
        run: targetregen demo
      - name: Tests, including every paper script
        run: pytest -q

  training-code:
    name: objectives against the training code (torch 2.9.1 CPU, transformers 4.57.6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install torch, transformers and the package
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.57.6 -e ".[test]"
      - name: Agreement tests, which fail here instead of skipping
        env:
          TARGETREGEN_REQUIRE_TORCH: "1"
        run: pytest -q tests/test_objectives.py

  install:
    name: clean install, used from outside the checkout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Non-editable install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Import and run away from the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import targetregen; print(targetregen.__version__)"
          targetregen --version
          targetregen demo
